name: Build Android AAB - API 36

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_ID: com.onrender.picnic3
      APP_NAME: "Picnic Vakti"
      SITE_URL: https://picnic-3.onrender.com

      KEY_ALIAS: ${{ secrets.KEY_ALIAS != '' && secrets.KEY_ALIAS || 'upload' }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEYSTORE_PASSWORD || 'picnic123' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD || 'picnic123' }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36"

          echo "Android API 36 installed successfully."

      - name: Create Capacitor project
        shell: bash
        run: |
          set -e

          mkdir -p mobile
          cd mobile

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor configuration
        working-directory: mobile
        shell: bash
        run: |
          set -e

          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "url": "${SITE_URL}",
              "cleartext": false
            }
          }
          EOF

          mkdir -p dist

          cat > dist/index.html <<EOF
          <!doctype html>
          <html lang="tr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Picnic Vakti</title>
          </head>
          <body>
            <p>Picnic Vakti yükleniyor...</p>
          </body>
          </html>
          EOF

      - name: Copy application icon
        shell: bash
        run: |
          set -e

          mkdir -p mobile/resources
          cp static/icons/icon-512.png mobile/resources/icon.png

      - name: Add Android platform
        working-directory: mobile
        shell: bash
        run: |
          set -e
          npx cap add android

      - name: Set compile SDK and target SDK to API 36
        working-directory: mobile
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          file_path = Path("android/variables.gradle")

          if not file_path.exists():
              raise FileNotFoundError(
                  f"Could not find Capacitor variables file: {file_path}"
              )

          text = file_path.read_text(encoding="utf-8")

          text, compile_count = re.subn(
              r"compileSdkVersion\s*=\s*\d+",
              "compileSdkVersion = 36",
              text,
              count=1,
          )

          text, target_count = re.subn(
              r"targetSdkVersion\s*=\s*\d+",
              "targetSdkVersion = 36",
              text,
              count=1,
          )

          if compile_count != 1:
              raise RuntimeError("compileSdkVersion could not be updated.")

          if target_count != 1:
              raise RuntimeError("targetSdkVersion could not be updated.")

          file_path.write_text(text, encoding="utf-8")
          PY

          echo "Updated Android SDK configuration:"
          cat android/variables.gradle

      - name: Generate Android icons
        working-directory: mobile
        shell: bash
        run: |
          set -e

          npm install --save-dev @capacitor/assets

          cat > assets.config.json <<EOF
          {
            "appIcon": {
              "imagePath": "resources/icon.png"
            }
          }
          EOF

          npx capacitor-assets generate

      - name: Set application version
        working-directory: mobile
        shell: bash
        run: |
          set -e

          VERSION_CODE=$(date +%s)
          VERSION_NAME="1.0.1"

          python3 - "$VERSION_CODE" "$VERSION_NAME" <<'PY'
          from pathlib import Path
          import re
          import sys

          version_code = sys.argv[1]
          version_name = sys.argv[2]

          file_path = Path("android/app/build.gradle")

          if not file_path.exists():
              raise FileNotFoundError(
                  f"Could not find Android build file: {file_path}"
              )

          text = file_path.read_text(encoding="utf-8")

          text, code_count = re.subn(
              r"versionCode\s+\d+",
              f"versionCode {version_code}",
              text,
              count=1,
          )

          text, name_count = re.subn(
              r'versionName\s+"[^"]*"',
              f'versionName "{version_name}"',
              text,
              count=1,
          )

          if code_count != 1:
              raise RuntimeError("versionCode could not be updated.")

          if name_count != 1:
              raise RuntimeError("versionName could not be updated.")

          file_path.write_text(text, encoding="utf-8")
          PY

          echo "Version code: $VERSION_CODE"
          echo "Version name: $VERSION_NAME"

      - name: Restore or create signing keystore
        working-directory: mobile/android/app
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" \
              | base64 --decode > upload.keystore

            if [ ! -s upload.keystore ]; then
              echo "Keystore file could not be restored."
              exit 1
            fi

            echo "Existing signing keystore restored."
          else
            echo "SIGNING_KEYSTORE_BASE64 secret was not found."
            echo "A temporary upload keystore will be generated."

            keytool -genkeypair \
              -v \
              -keystore upload.keystore \
              -storepass "${KEYSTORE_PASSWORD}" \
              -keypass "${KEY_PASSWORD}" \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Picnic Vakti, OU=Mobile, O=Picnic, L=Istanbul, ST=Istanbul, C=TR"
          fi

          test -s upload.keystore

      - name: Configure release signing
        working-directory: mobile
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          file_path = Path("android/app/build.gradle")

          if not file_path.exists():
              raise FileNotFoundError(
                  f"Could not find Android build file: {file_path}"
              )

          text = file_path.read_text(encoding="utf-8")

          signing_config = """
              signingConfigs {
                  release {
                      storeFile file("upload.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          if "signingConfigs {" not in text:
              text, android_count = re.subn(
                  r"android\s*\{",
                  lambda match: match.group(0) + signing_config,
                  text,
                  count=1,
              )

              if android_count != 1:
                  raise RuntimeError(
                      "The android configuration block could not be found."
                  )

          if "signingConfig signingConfigs.release" not in text:
              text, release_count = re.subn(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  text,
                  count=1,
                  flags=re.DOTALL,
              )

              if release_count != 1:
                  raise RuntimeError(
                      "The release build type could not be found."
                  )

          file_path.write_text(text, encoding="utf-8")
          PY

          echo "Release signing configuration added."

      - name: Verify Android configuration
        working-directory: mobile
        shell: bash
        run: |
          set -e

          echo "----- variables.gradle -----"
          cat android/variables.gradle

          echo "----- version information -----"
          grep -n "versionCode\|versionName" android/app/build.gradle

          echo "----- signing information -----"
          grep -n "signingConfigs\|signingConfig" android/app/build.gradle

      - name: Build signed Android App Bundle
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew
          ./gradlew --no-daemon clean bundleRelease

          echo "Generated AAB files:"
          find app/build/outputs/bundle/release \
            -type f \
            -name "*.aab" \
            -print

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: picnic-api36-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
